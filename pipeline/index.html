<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fassaden-Explorer</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a20;
    --panel-2: #1d222a;
    --line: #2a313b;
    --text: #e8ebf0;
    --muted: #8b95a3;
    --accent: #ffb000;
    --c-S: #ff5a36;
    --c-SO: #ffb000;
    --c-SW: #ff3ea5;
    --c-other: #c9d1dc;
    --c-balkon: #3ee08f;
    --c-loggia: #4cc3ff;
    --c-unsicher: #b9c2cf;
    --radius: 8px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  body { display: grid; grid-template-columns: 340px 1fr; overflow: hidden; }

  /* ---------- Seitenleiste ---------- */
  #side { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto;
    display: flex; flex-direction: column; }
  .sec { padding: 16px 18px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; margin: 0 0 2px; font-weight: 650; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 12px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .9px; color: var(--muted);
    margin: 0 0 10px; font-weight: 600; }

  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .stat { background: var(--panel-2); border-radius: var(--radius); padding: 9px 10px; }
  .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; font-weight: 650; }
  .stat span { color: var(--muted); font-size: 11px; }

  .rose-wrap { display: flex; gap: 14px; align-items: center; }
  #rose { width: 132px; height: 132px; flex: none; }
  #rose path { cursor: pointer; stroke: var(--panel); stroke-width: 2; transition: opacity .15s; }
  #rose path:hover { opacity: .8; }
  #rose text { font-size: 10px; font-weight: 650; fill: #0f1115; pointer-events: none; text-anchor: middle; dominant-baseline: central; }
  #rose text.off { fill: var(--muted); }
  .rose-help { font-size: 12px; color: var(--muted); }
  .rose-help .lg { display: flex; align-items: center; gap: 7px; color: var(--text); margin: 3px 0; }
  .sw { width: 18px; height: 4px; border-radius: 2px; display: inline-block; }

  .ctl { margin: 10px 0 2px; }
  .ctl label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .ctl label b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .toggle { display: flex; align-items: center; gap: 8px; margin: 7px 0; font-size: 13px; cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--accent); width: 15px; height: 15px; }
  .quick { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  button:hover { border-color: #3b4552; }

  #list { list-style: none; margin: 0; padding: 0; }
  #list li { display: grid; grid-template-columns: 10px 1fr auto; gap: 9px; align-items: center;
    padding: 6px 6px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  #list li:hover, #list li.on { background: var(--panel-2); }
  #list .dot { width: 10px; height: 10px; border-radius: 50%; }
  #list .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  #list .bk { color: var(--c-balkon); font-weight: 650; }
  .foot { color: var(--muted); font-size: 11px; padding: 14px 18px; margin-top: auto; }

  /* ---------- Karte ---------- */
  main { position: relative; overflow: hidden; }
  #map { width: 100%; height: 100%; display: block; cursor: grab; background: #0b0d10; touch-action: none;
    transition: filter .7s ease, transform .9s cubic-bezier(.2,.7,.2,1); transform-origin: 50% 60%; }
  #map.dragging { cursor: grabbing; }
  #map.sunk { filter: blur(3px) brightness(.45) saturate(.8); transform: perspective(1200px) rotateX(18deg) scale(1.08); }
  .f line { vector-effect: non-scaling-stroke; stroke-linecap: round; }
  .f .halo { stroke: rgba(0,0,0,.75); }
  .f { cursor: pointer; }
  .f.other .main { stroke: var(--c-other); opacity: .75; }
  .f.hover .halo, .f.sel .halo { stroke: #fff; }
  .arrow { pointer-events: none; }
  .badge-bk circle { fill: var(--c-balkon); stroke: #0b0d10; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .badge-bk text { fill: #06210f; font-weight: 750; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .badge-bk { cursor: pointer; }

  .mapui { position: absolute; display: flex; gap: 6px; }
  .zoom { right: 14px; top: 14px; flex-direction: column; }
  .zoom button { width: 34px; height: 34px; font-size: 18px; padding: 0; background: rgba(22,26,32,.92); }
  .scale { left: 14px; bottom: 14px; background: rgba(22,26,32,.85); padding: 5px 9px; border-radius: 6px;
    font-size: 11px; align-items: center; gap: 8px; }
  .scale i { display: block; height: 6px; border: 2px solid var(--text); border-top: 0; }
  .north { right: 14px; bottom: 14px; background: rgba(22,26,32,.85); border-radius: 50%; width: 38px; height: 38px;
    justify-content: center; align-items: center; font-weight: 700; font-size: 12px; }
  #tip { position: absolute; pointer-events: none; background: rgba(15,17,21,.95); border: 1px solid var(--line);
    padding: 6px 9px; border-radius: 6px; font-size: 12px; white-space: nowrap; display: none; z-index: 5; }

  /* ---------- Eintauch-Ansicht ---------- */
  #imm { position: absolute; inset: 0; display: none; perspective: 1400px; perspective-origin: 50% 35%; z-index: 10; }
  #imm.open { display: block; }
  #immCard { position: absolute; left: 50%; top: 50%; width: min(1180px, calc(100% - 48px));
    max-height: calc(100% - 48px); display: flex; flex-direction: column;
    background: rgba(18,21,26,.97); border: 1px solid #333c48; border-radius: 14px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03) inset;
    transform-style: preserve-3d; will-change: transform, opacity; }
  #immCard.anim { transition: transform .95s cubic-bezier(.16,.84,.24,1), opacity .5s ease; }
  #immCard.tilt { transition: transform .25s ease-out; }
  .imm-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .imm-head .badge { font-weight: 700; font-size: 12px; padding: 3px 8px; border-radius: 5px; color: #0f1115; }
  .imm-head h3 { margin: 0; font-size: 15px; }
  .imm-head .facts { color: var(--muted); font-size: 12px; flex: 1; }
  .imm-head button { border: 0; background: transparent; font-size: 22px; color: var(--muted); padding: 0 4px; line-height: 1; }
  .imm-body { display: grid; grid-template-columns: 1fr 300px; min-height: 0; flex: 1; }
  .imm-view { position: relative; background: radial-gradient(ellipse at 50% 120%, #2a2f37 0%, #121418 70%);
    display: flex; align-items: center; justify-content: center; padding: 22px; overflow: auto; min-height: 0; }
  .facade-wrap { position: relative; display: inline-block; max-width: 100%; transform-style: preserve-3d;
    box-shadow: 0 18px 40px rgba(0,0,0,.55); }
  .facade-wrap img { display: block; max-width: 100%; max-height: calc(100vh - 220px); }
  .facade-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bk rect { fill: transparent; stroke-width: 2.5; vector-effect: non-scaling-stroke; cursor: pointer; transition: fill .15s; }
  .bk.Balkon rect { stroke: var(--c-balkon); }
  .bk.Loggia rect { stroke: var(--c-loggia); }
  .bk.unsicher rect { stroke: var(--c-unsicher); stroke-dasharray: 5 4; }
  .bk:hover rect { fill: rgba(255,255,255,.18); }
  .bk.sel rect { fill: rgba(62,224,143,.28); stroke-width: 4; }
  .bk.Loggia.sel rect { fill: rgba(76,195,255,.28); }
  .ground-line { stroke: rgba(255,255,255,.25); stroke-dasharray: 6 6; vector-effect: non-scaling-stroke; }
  .imm-legend { position: absolute; left: 22px; bottom: 12px; display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  .imm-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .imm-legend i { width: 12px; height: 12px; border-radius: 2px; border: 2px solid; display: inline-block; }
  .imm-info { border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; font-size: 13px; }
  .imm-info h4 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 600; }
  .imm-info .big { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; margin: 10px 0 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
  .module-box { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 6px; }
  .module-box .mods { display: flex; gap: 6px; margin: 8px 0; }
  .module-box .mod { height: 34px; border-radius: 3px; background: repeating-linear-gradient(90deg, #1f3a73 0 10px, #23427f 10px 11px);
    border: 2px solid #9fb2d6; }
  .note { color: var(--muted); font-size: 11px; line-height: 1.4; margin-top: 10px; }
  .hint { color: var(--muted); font-size: 13px; }
  .pill { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); margin-right: 4px; }

  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: 46vh 1fr; }
    #side { order: 2; border-right: 0; border-top: 1px solid var(--line); }
    .imm-body { grid-template-columns: 1fr; }
    .imm-info { border-left: 0; border-top: 1px solid var(--line); }
  }
  @media (prefers-reduced-motion: reduce) {
    #immCard.anim, #map { transition: none; }
  }
  .btn-angebot { display: inline-block; margin-top: 6px; background: #eda100; color: #111; font-weight: 600; text-decoration: none; padding: 7px 12px; border-radius: 8px; }
  .btn-angebot:hover { background: #ffb820; }

  /* ---------- Ladebildschirm: Angebot wird erstellt ---------- */
  #laden { position: fixed; inset: 0; z-index: 1000; background: #e9efe5; color: #1c3a29; display: none; place-items: center;
           font-family: Figtree, system-ui, sans-serif; opacity: 0; transition: opacity .35s; }
  #laden.zeigen { display: grid; }
  #laden.sichtbar { opacity: 1; }
  #laden .box { width: min(640px, 92vw); text-align: center; }
  #laden .box svg { width: 100%; height: auto; display: block; }
  #laden h2 { text-transform: none; color: #1c3a29; font-family: "Bricolage Grotesque", Figtree, sans-serif; font-size: clamp(24px, 3.4vw, 32px); font-weight: 750; letter-spacing: -.02em; margin: 6px 0 4px; }
  #laden p { margin: 0 0 16px; color: #5f7566; font-size: 15px; min-height: 1.5em; }
  #laden .bar { height: 6px; width: min(320px, 70vw); margin: 0 auto; border-radius: 999px; background: #d3ddd0; overflow: hidden; }
  #laden .bar i { display: block; height: 100%; width: 0; background: #2f7d4f; border-radius: inherit; transition: width .5s ease-out; }
  #laden .marke { position: absolute; top: 22px; left: 28px; font-family: "Bricolage Grotesque", Figtree, sans-serif; font-weight: 650; font-size: 19px; display: flex; gap: 9px; align-items: center; }
  #laden .sonne { animation: sonne-auf 1.8s cubic-bezier(.2,.7,.3,1) forwards; }
  #laden .strahlen { transform-origin: 0 0; animation: drehen 9s linear infinite; }
  #laden .wolke1 { animation: ziehen 14s linear infinite; }
  #laden .wolke2 { animation: ziehen 19s linear infinite -6s; }
  #laden .glanz { animation: glanz 1.6s ease-in-out 1.4s infinite; }
  #laden .fenster-licht { opacity: 0; animation: an .6s ease-out 2.1s forwards; }
  #laden .funke { offset-path: path("M196 238 C 196 272, 150 266, 134 222"); offset-rotate: 0deg; opacity: 0;
                  animation: fliessen 1.2s ease-in infinite; }
  #laden .funke:nth-of-type(2) { animation-delay: 1.8s; } #laden .funke:nth-of-type(3) { animation-delay: 2.2s; } #laden .funke:nth-of-type(4) { animation-delay: 2.6s; }
  #laden .funke:nth-of-type(1) { animation-delay: 1.4s; }
  #laden .augen { animation: blinzeln 3.2s infinite; transform-origin: 470px 143px; }
  @keyframes sonne-auf { from { transform: translate(70px, 330px); } to { transform: translate(250px, 78px); } }
  @keyframes drehen { to { transform: rotate(360deg); } }
  @keyframes ziehen { from { transform: translateX(-140px); } to { transform: translateX(680px); } }
  @keyframes glanz { 0% { transform: translateX(-80px); } 60%, 100% { transform: translateX(120px); } }
  @keyframes an { to { opacity: 1; } }
  @keyframes fliessen { 0% { offset-distance: 0%; opacity: 0; } 15% { opacity: 1; } 90% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
  @keyframes blinzeln { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @media (prefers-reduced-motion: reduce) { #laden * { animation-duration: .01s !important; animation-iteration-count: 1 !important; } }
</style>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,650;12..96,750&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="side">
  <div class="sec">
    <h1>Fassaden-Explorer</h1>
    <div class="sub" id="tileinfo"></div>
  </div>

  <div class="sec">
    <h2>Sichtbare Fassaden</h2>
    <div class="stats">
      <div class="stat"><b id="sCount">0</b><span>Fassaden</span></div>
      <div class="stat"><b id="sBk">–</b><span>Balkone/Loggien</span></div>
      <div class="stat"><b id="sMod">–</b><span>Module möglich</span></div>
    </div>
    <div class="sub" id="sInfo" style="margin-top:8px"></div>
  </div>

  <div class="sec">
    <h2>Ausrichtung</h2>
    <div class="rose-wrap">
      <svg id="rose" viewBox="-70 -70 140 140" aria-label="Windrose zum Filtern der Himmelsrichtungen"></svg>
      <div class="rose-help">
        Segment anklicken zum Ein- und Ausblenden.
        <div class="lg"><span class="sw" style="background:var(--c-SO)"></span>Südost</div>
        <div class="lg"><span class="sw" style="background:var(--c-S)"></span>Süd</div>
        <div class="lg"><span class="sw" style="background:var(--c-SW)"></span>Südwest</div>
      </div>
    </div>
    <div class="quick">
      <button data-q="S">Nur Süd</button>
      <button data-q="target">SO / S / SW</button>
      <button data-q="all">Alle</button>
    </div>
    <label class="toggle"><input type="checkbox" id="tOthers" checked>Übrige Fassaden grau zeigen</label>
    <label class="toggle"><input type="checkbox" id="tOnlyBk">Nur Fassaden mit Balkonen</label>
  </div>

  <div class="sec">
    <h2>Filter</h2>
    <div class="ctl">
      <label>Mindestlänge <b id="vLen"></b></label>
      <input type="range" id="fLen" min="3" max="40" step="1" value="3">
    </div>
    <div class="ctl">
      <label>Mindesthöhe <b id="vH"></b></label>
      <input type="range" id="fH" min="3" max="30" step="1" value="3">
    </div>
    <div class="ctl">
      <label>Wandnachweis im Mesh mind. <b id="vEv"></b></label>
      <input type="range" id="fEv" min="0" max="100" step="5" value="0">
    </div>
  </div>

  <div class="sec">
    <h2>Ebenen</h2>
    <label class="toggle"><input type="checkbox" id="lOrtho" checked>Luftbild</label>
    <label class="toggle"><input type="checkbox" id="lMask">Gebäude-/Baummaske</label>
    <label class="toggle"><input type="checkbox" id="lArrows" checked>Blickrichtung der Fassaden</label>
    <label class="toggle"><input type="checkbox" id="lBadges" checked>Balkonanzahl auf der Karte</label>
  </div>

  <div class="sec">
    <h2>Fassaden <span id="listInfo" style="text-transform:none;letter-spacing:0"></span></h2>
    <ul id="list"></ul>
  </div>

  <div class="foot" id="foot"></div>
</div>

<main>
  <svg id="map" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ah-S" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff5a36"/></marker>
      <marker id="ah-SO" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffb000"/></marker>
      <marker id="ah-SW" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff3ea5"/></marker>
      <marker id="ah-x" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c9d1dc"/></marker>
    </defs>
    <g id="world">
      <image id="ortho" preserveAspectRatio="none"/>
      <image id="mask" preserveAspectRatio="none" style="display:none"/>
      <g id="others"></g>
      <g id="targets"></g>
      <g id="arrows"></g>
      <g id="badges"></g>
    </g>
  </svg>
  <div class="mapui zoom">
    <button id="zIn" title="Hineinzoomen">+</button>
    <button id="zOut" title="Herauszoomen">−</button>
    <button id="zFit" title="Ganze Kachel" style="font-size:13px">⤢</button>
  </div>
  <div class="mapui scale"><i id="scaleBar"></i><span id="scaleTxt"></span></div>
  <div class="mapui north" title="Norden (Gitternord, UTM)">N</div>
  <div id="tip"></div>

  <section id="imm" aria-modal="true" role="dialog">
    <div id="immCard">
      <div class="imm-head">
        <span class="badge" id="iBadge"></span>
        <h3 id="iTitle"></h3>
        <span class="facts" id="iFacts"></span>
        <button id="iClose" title="Zurück zur Karte (Esc)">×</button>
      </div>
      <div class="imm-body">
        <div class="imm-view" id="iView">
          <div class="facade-wrap" id="iWrap">
            <img id="iImg" alt="Frontalansicht der Fassade aus dem 3D-Mesh">
            <svg id="iSvg" preserveAspectRatio="none"></svg>
          </div>
          <div class="imm-legend">
            <span><i style="border-color:var(--c-balkon)"></i>Balkon</span>
            <span><i style="border-color:var(--c-loggia)"></i>Loggia</span>
            <span><i style="border-color:var(--c-unsicher);border-style:dashed"></i>unsicher</span>
          </div>
        </div>
        <div class="imm-info" id="iInfo"></div>
      </div>
    </div>
  </section>
</main>

<script src="data.js"></script>
<script src="balkone.js" onerror="window.BALKONE = window.BALKONE || {}"></script>
<script src="ertrag.js" onerror="window.ERTRAG = null"></script>
<script src="angebote.js" onerror="window.ANGEBOTE = []"></script>
<script>
(() => {
  const D = window.FASSADEN;
  if (!D) { document.body.innerHTML = '<p style="padding:2em">data.js fehlt. Bitte zuerst die Pipeline ausführen.</p>'; return; }
  const BK = window.BALKONE || {};
  const M = D.meta;
  const [xmin, ymin, xmax, ymax] = M.bounds;
  const R = M.ortho.res;
  const OW = M.ortho.w, OH = M.ortho.h;
  const SECT = ['N','NO','O','SO','S','SW','W','NW'];
  const NAMES = {N:'Nord',NO:'Nordost',O:'Ost',SO:'Südost',S:'Süd',SW:'Südwest',W:'West',NW:'Nordwest'};
  const css = getComputedStyle(document.documentElement);
  const COL = c => ({S: css.getPropertyValue('--c-S'), SO: css.getPropertyValue('--c-SO'), SW: css.getPropertyValue('--c-SW')}[c] || css.getPropertyValue('--c-other')).trim();
  const isTargetCls = c => M.target_classes.includes(c);
  const fmt = (v, d = 0) => (v ?? 0).toLocaleString('de-DE', {maximumFractionDigits: d, minimumFractionDigits: d});
  const toPx = p => [(p[0] - xmin) / R, (ymax - p[1]) / R];
  const $ = id => document.getElementById(id);

  // ---------- Annahmen für Module und Ertrag ----------
  const MODUL = {w: 1.72, h: 1.13, wp: 430, gap: 0.04};       // Standardmodul quer am Geländer
  const KLEIN = {w: 1.15, wp: 250};                           // kleines Modul für schmale Balkone
  const MAX_MODULE = 2;                                        // 800-W-Wechselrichter: 2 Module sinnvoll
  const STROMPREIS = 0.37, EIGENVERBRAUCH = 0.6;
  // spezifischer Jahresertrag senkrechter Module in Berlin (kWh/kWp), abhängig von der Abweichung von Süd
  const ertragFaktor = az => { const d = Math.abs(((az - 180 + 540) % 360) - 180) * Math.PI / 180;
    return 700 * (1 - 0.35 * (1 - Math.cos(d))); };

  function modulVorschlag(b, az) {
    const fit = Math.floor((b.breite_m + MODUL.gap) / (MODUL.w + MODUL.gap));
    let n = Math.min(fit, MAX_MODULE), wp, text;
    if (n >= 1) { wp = n * MODUL.wp; text = `${n} × Standardmodul (${fmt(MODUL.w, 2)} × ${fmt(MODUL.h, 2)} m, je ${MODUL.wp} Wp)`; }
    else if (b.breite_m >= KLEIN.w + 0.05) { n = 1; wp = KLEIN.wp; text = `1 × kleines Modul (ca. ${fmt(KLEIN.w, 2)} m breit, ~${KLEIN.wp} Wp)`; }
    else { return {n: 0, fit: 0, wp: 0, kwh: 0, eur: 0, text: 'zu schmal für ein Standardmodul'}; }
    const kwh = wp / 1000 * ertragFaktor(az);
    return {n, fit, wp, kwh, eur: kwh * EIGENVERBRAUCH * STROMPREIS, text};
  }

  const state = {
    on: new Set(['S']), others: true, onlyBk: false,
    minLen: 3, minH: 3, minEv: 0, sel: null, hover: null,
  };

  // ---------- Kopf / Fuß ----------
  const nEval = Object.keys(BK).length;
  $('tileinfo').textContent =
    `Kachel ${M.tile} · ${fmt(xmax - xmin)} × ${fmt(ymax - ymin)} m · ${fmt(M.center_ll[0], 4)}° N, ${fmt(M.center_ll[1], 4)}° O`;
  $('foot').innerHTML =
    `Quelle: ${M.source}. Fassaden automatisch aus dem Mesh abgeleitet (${M.generated}). ` +
    `${nEval ? `${nEval} Fassaden mit Claude auf Balkone ausgewertet. ` : ''}` +
    `Maße aus Bildmaßstab, Genauigkeit ca. ±0,3–0,5 m. Ertrag: grobe Schätzung für senkrechte Module ohne Verschattung.`;

  // ---------- Karte ----------
  const svg = $('map');
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const ortho = $('ortho');
  ortho.setAttribute('href', M.ortho.file); ortho.setAttribute('width', OW); ortho.setAttribute('height', OH);
  const mask = $('mask');
  mask.setAttribute('href', M.mask.file);
  mask.setAttribute('width', M.mask.w * M.mask.res / R); mask.setAttribute('height', M.mask.h * M.mask.res / R);

  const gT = $('targets'), gO = $('others'), gA = $('arrows'), gB = $('badges');
  const byId = new Map();
  for (const f of D.facades) {
    const [ax, ay] = toPx(f.a), [bx, by] = toPx(f.b);
    f._px = {ax, ay, bx, by, mx: (ax + bx) / 2, my: (ay + by) / 2};
    f._bk = BK[String(f.id)] || null;
    f._nbk = f._bk ? f._bk.balkone.filter(b => b.typ !== 'unsicher').length : null;
    f._nmod = f._bk ? f._bk.balkone.filter(b => b.typ !== 'unsicher').reduce((s, b) => s + modulVorschlag(b, f.az).n, 0) : 0;
    const g = el('g', {class: 'f', 'data-id': f.id});
    f._halo = el('line', {class: 'halo', x1: ax, y1: ay, x2: bx, y2: by}, g);
    f._main = el('line', {class: 'main', x1: ax, y1: ay, x2: bx, y2: by}, g);
    el('line', {x1: ax, y1: ay, x2: bx, y2: by, stroke: 'transparent', 'stroke-width': 14, 'vector-effect': 'non-scaling-stroke'}, g);
    f._g = g;
    const L = 3.5 / R;
    f._arrow = el('line', {class: 'arrow', x1: f._px.mx, y1: f._px.my,
      x2: f._px.mx + f.n[0] * L, y2: f._px.my - f.n[1] * L,
      stroke: COL(f.cls), 'stroke-width': 2.5, 'vector-effect': 'non-scaling-stroke', 'marker-end': `url(#ah-${isTargetCls(f.cls) ? f.cls : 'x'})`});
    if (f._nbk) {
      const off = 7 / R;
      const b = el('g', {class: 'badge-bk', 'data-id': f.id, transform: `translate(${f._px.mx + f.n[0] * off} ${f._px.my - f.n[1] * off})`});
      el('circle', {r: 2.6 / R}, b);
      const t = el('text', {'font-size': 3.2 / R}, b); t.textContent = f._nbk;
      f._badge = b;
    }
    byId.set(f.id, f);
  }

  // ---------- Windrose ----------
  const rose = $('rose');
  const wedge = (i) => {
    const a0 = (i * 45 - 22.5 - 90) * Math.PI / 180, a1 = (i * 45 + 22.5 - 90) * Math.PI / 180;
    const r0 = 22, r1 = 66;
    const p = (r, a) => `${(r * Math.cos(a)).toFixed(2)} ${(r * Math.sin(a)).toFixed(2)}`;
    return `M${p(r0, a0)} L${p(r1, a0)} A${r1} ${r1} 0 0 1 ${p(r1, a1)} L${p(r0, a1)} A${r0} ${r0} 0 0 0 ${p(r0, a0)}Z`;
  };
  const roseParts = SECT.map((c, i) => {
    const path = el('path', {d: wedge(i)}, rose);
    const a = (i * 45 - 90) * Math.PI / 180;
    const t = el('text', {x: 44 * Math.cos(a), y: 44 * Math.sin(a)}, rose);
    t.textContent = c;
    el('title', {}, path).textContent = NAMES[c];
    path.addEventListener('click', () => { state.on.has(c) ? state.on.delete(c) : state.on.add(c); render(); });
    return {c, path, t};
  });
  el('circle', {r: 18, fill: 'var(--panel-2)'}, rose);
  const roseCount = el('text', {y: 0, style: 'fill:var(--text);font-size:11px'}, rose);

  // ---------- Steuerelemente ----------
  const bindRange = (id, out, key, conv, label) => {
    const inp = $(id);
    const upd = () => { state[key] = conv(+inp.value); $(out).textContent = label(+inp.value); render(); };
    inp.addEventListener('input', upd);
    $(out).textContent = label(+inp.value);
    state[key] = conv(+inp.value);
  };
  bindRange('fLen', 'vLen', 'minLen', v => v, v => `${v} m`);
  bindRange('fH', 'vH', 'minH', v => v, v => `${v} m`);
  bindRange('fEv', 'vEv', 'minEv', v => v / 100, v => `${v} %`);
  $('tOthers').addEventListener('change', e => { state.others = e.target.checked; render(); });
  $('tOnlyBk').addEventListener('change', e => { state.onlyBk = e.target.checked; render(); });
  $('lOrtho').addEventListener('change', e => { ortho.style.display = e.target.checked ? '' : 'none'; });
  $('lMask').addEventListener('change', e => { mask.style.display = e.target.checked ? '' : 'none'; });
  $('lArrows').addEventListener('change', e => { gA.style.display = e.target.checked ? '' : 'none'; });
  $('lBadges').addEventListener('change', e => { gB.style.display = e.target.checked ? '' : 'none'; });
  document.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => {
    state.on = new Set(b.dataset.q === 'all' ? SECT : b.dataset.q === 'S' ? ['S'] : M.target_classes); render();
  }));

  const passes = f => f.len >= state.minLen && f.h >= state.minH && f.ev >= state.minEv && (!state.onlyBk || f._nbk > 0);

  // ---------- Rendern ----------
  function render() {
    gT.textContent = ''; gO.textContent = ''; gA.textContent = ''; gB.textContent = '';
    let n = 0, nbk = 0, nmod = 0, nev = 0;
    const shown = [];
    for (const f of D.facades) {
      const ok = passes(f), active = state.on.has(f.cls);
      f._shown = false;
      if (ok && active) {
        f._g.setAttribute('class', 'f' + (f.id === state.sel ? ' sel' : ''));
        f._main.setAttribute('stroke', COL(f.cls));
        f._main.setAttribute('stroke-width', isTargetCls(f.cls) ? 4 : 3);
        f._halo.setAttribute('stroke-width', isTargetCls(f.cls) ? 7 : 6);
        gT.appendChild(f._g); gA.appendChild(f._arrow);
        if (f._badge) gB.appendChild(f._badge);
        f._shown = true;
        n++; shown.push(f);
        if (f._bk) { nev++; nbk += f._nbk; nmod += f._nmod; }
      } else if (ok && state.others && !state.onlyBk) {
        f._g.setAttribute('class', 'f other' + (f.id === state.sel ? ' sel' : ''));
        f._main.setAttribute('stroke-width', 1.5);
        f._halo.setAttribute('stroke-width', 3.5);
        gO.appendChild(f._g);
        f._shown = true;
      }
    }
    $('sCount').textContent = fmt(n);
    $('sBk').textContent = nev ? fmt(nbk) : '–';
    $('sMod').textContent = nev ? fmt(nmod) : '–';
    $('sInfo').textContent = nev ? `${nev} von ${n} sichtbaren Fassaden ausgewertet` : 'Noch keine Balkonauswertung für diese Auswahl';
    for (const p of roseParts) {
      const on = state.on.has(p.c);
      p.path.setAttribute('fill', on ? (isTargetCls(p.c) ? COL(p.c) : '#c9d1dc') : '#262c35');
      p.t.setAttribute('class', on ? '' : 'off');
    }
    roseCount.textContent = n;
    shown.sort((a, b) => (b._nbk ?? -1) - (a._nbk ?? -1) || b.area - a.area);
    const ul = $('list'); ul.textContent = '';
    $('listInfo').textContent = shown.length > 60 ? `(60 von ${shown.length})` : `(${shown.length})`;
    for (const f of shown.slice(0, 60)) {
      const li = document.createElement('li');
      if (f.id === state.sel) li.className = 'on';
      const bk = f._bk ? `<span class="bk">${f._nbk} Balk.</span> · ` : '';
      li.innerHTML = `<span class="dot" style="background:${COL(f.cls)}"></span>` +
        `<span>#${f.id} ${NAMES[f.cls]}${f.kind === 'stufe' ? ' <span class="pill">Höhensprung</span>' : ''}</span>` +
        `<span class="meta">${bk}${fmt(f.len)} m</span>`;
      li.addEventListener('click', () => openFacade(f.id, true));
      ul.appendChild(li);
    }
  }

  // ---------- Pan & Zoom ----------
  let view = {x: 0, y: 0, w: OW, h: OH};
  const apply = () => { svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`); updateScale(); };
  function fit() {
    const r = svg.getBoundingClientRect();
    const s = Math.max(OW / r.width, OH / r.height) * 1.02;
    view = {w: r.width * s, h: r.height * s, x: (OW - r.width * s) / 2, y: (OH - r.height * s) / 2};
    apply();
  }
  function zoomAt(cx, cy, k) {
    const nw = Math.min(Math.max(view.w * k, 60), OW * 4);
    const kk = nw / view.w;
    view.x = cx - (cx - view.x) * kk; view.y = cy - (cy - view.y) * kk;
    view.w *= kk; view.h *= kk; apply();
  }
  const toWorld = (clientX, clientY) => {
    const r = svg.getBoundingClientRect();
    return [view.x + (clientX - r.left) / r.width * view.w, view.y + (clientY - r.top) / r.height * view.h];
  };
  const toClient = (wx, wy) => {
    const r = svg.parentElement.getBoundingClientRect();
    return [(wx - view.x) / view.w * r.width, (wy - view.y) / view.h * r.height];
  };
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const [wx, wy] = toWorld(e.clientX, e.clientY);
    zoomAt(wx, wy, Math.exp(e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)));
  }, {passive: false});
  let drag = null;
  svg.addEventListener('pointerdown', e => {
    drag = {x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false};
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', e => {
    if (drag) {
      const r = svg.getBoundingClientRect();
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) { drag.moved = true; svg.classList.add('dragging'); }
      view.x = drag.vx - dx / r.width * view.w; view.y = drag.vy - dy / r.height * view.h; apply();
      hideTip(); return;
    }
    const g = e.target.closest && (e.target.closest('.f') || e.target.closest('.badge-bk'));
    setHover(g ? +g.dataset.id : null, e);
  });
  svg.addEventListener('pointerup', e => {
    svg.classList.remove('dragging');
    if (drag && !drag.moved) {
      const hit = document.elementsFromPoint(e.clientX, e.clientY).find(n => n.closest && (n.closest('.f') || n.closest('.badge-bk')));
      if (hit) openFacade(+(hit.closest('.f') || hit.closest('.badge-bk')).dataset.id, false);
    }
    drag = null;
  });
  svg.addEventListener('pointerleave', () => setHover(null));
  $('zIn').addEventListener('click', () => zoomAt(view.x + view.w / 2, view.y + view.h / 2, 0.6));
  $('zOut').addEventListener('click', () => zoomAt(view.x + view.w / 2, view.y + view.h / 2, 1 / 0.6));
  $('zFit').addEventListener('click', fit);
  window.addEventListener('resize', () => { const r = svg.getBoundingClientRect(); view.h = view.w * r.height / r.width; apply(); });

  function flyTo(f) {
    const r = svg.getBoundingClientRect();
    const span = Math.max(Math.abs(f._px.bx - f._px.ax), Math.abs(f._px.by - f._px.ay), 30 / R);
    const w = Math.max(span * 2.2, 70 / R), h = w * r.height / r.width;
    view = {x: f._px.mx - w / 2, y: f._px.my - h / 2, w, h};
    apply();
  }

  // ---------- Tooltip ----------
  const tip = $('tip');
  function hideTip() { tip.style.display = 'none'; }
  function setHover(id, e) {
    if (state.hover !== null && state.hover !== id) { const p = byId.get(state.hover); if (p) p._g.classList.remove('hover'); }
    state.hover = id;
    if (id === null) { hideTip(); return; }
    const f = byId.get(id);
    f._g.classList.add('hover');
    const r = svg.parentElement.getBoundingClientRect();
    const bk = f._bk ? ` · <b style="color:var(--c-balkon)">${f._nbk} Balkone</b>` : '';
    tip.innerHTML = `<b style="color:${COL(f.cls)}">${NAMES[f.cls]}</b> · ${fmt(f.az)}° · ${fmt(f.len)} m · ${fmt(f.h)} m hoch${bk}`;
    tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX - r.left + 14, r.width - tip.offsetWidth - 8) + 'px';
    tip.style.top = (e.clientY - r.top + 14) + 'px';
  }

  // ---------- Maßstab ----------
  function updateScale() {
    const r = svg.getBoundingClientRect();
    const pxPerM = r.width / (view.w * R);
    let m = 1;
    for (const v of [1, 2, 5, 10, 20, 25, 50, 100, 200, 500]) if (v * pxPerM <= 130) m = v;
    $('scaleBar').style.width = (m * pxPerM) + 'px';
    $('scaleTxt').textContent = `${m} m`;
  }

  // ---------- Eintauch-Ansicht ----------
  const imm = $('imm'), card = $('immCard');
  let openId = null, selBk = null, opened = false;

  function startTransform(f) {
    const r = imm.getBoundingClientRect();
    const [cx, cy] = toClient(f._px.mx, f._px.my);
    const dx = cx - r.width / 2, dy = cy - r.height / 2;
    return `translate(-50%, -50%) translate(${dx}px, ${dy}px) rotateX(78deg) scale(.18)`;
  }

  function openFacade(id, fly) {
    const f = byId.get(id);
    if (!f) return;
    state.sel = id; render();
    if (fly) flyTo(f);
    openId = id; selBk = null; opened = false;
    fillCard(f);
    imm.classList.add('open');
    svg.classList.add('sunk');
    card.classList.remove('anim', 'tilt');
    card.style.opacity = '0';
    card.style.transform = startTransform(f);
    card.getBoundingClientRect();
    requestAnimationFrame(() => {
      card.classList.add('anim');
      card.style.opacity = '1';
      card.style.transform = 'translate(-50%, -50%)';
      setTimeout(() => { opened = true; card.classList.remove('anim'); card.classList.add('tilt'); }, 980);
    });
  }

  function closeFacade() {
    if (openId === null) return;
    const f = byId.get(openId);
    opened = false;
    card.classList.remove('tilt'); card.classList.add('anim');
    card.style.transform = startTransform(f);
    card.style.opacity = '0';
    svg.classList.remove('sunk');
    setTimeout(() => { imm.classList.remove('open'); card.classList.remove('anim'); }, 700);
    openId = null;
  }
  $('iClose').addEventListener('click', closeFacade);
  imm.addEventListener('pointerdown', e => { if (e.target === imm) closeFacade(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeFacade(); });
  imm.addEventListener('mousemove', e => {
    if (!opened) return;
    const r = imm.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    card.style.transform = `translate(-50%, -50%) rotateY(${x * 3.5}deg) rotateX(${-y * 2.5}deg)`;
  });
  imm.addEventListener('mouseleave', () => { if (opened) card.style.transform = 'translate(-50%, -50%)'; });

  function fillCard(f) {
    $('iBadge').textContent = f.cls; $('iBadge').style.background = COL(f.cls);
    $('iTitle').textContent = `Fassade #${f.id} · ${NAMES[f.cls]}`;
    $('iFacts').textContent = `${fmt(f.az)}° · ${fmt(f.len, 1)} m breit · ${fmt(f.h, 1)} m hoch` +
      (f.kind === 'stufe' ? ' · Wand über Nachbardach' : '') + ` · Wandnachweis ${fmt(f.ev * 100)} %`;
    const img = $('iImg'), s = $('iSvg');
    s.textContent = '';
    if (!f.img) { img.removeAttribute('src'); $('iInfo').innerHTML = '<p class="hint">Für diese Fassade gibt es kein Bild.</p>'; return; }
    img.onload = () => drawBalkone(f);
    img.src = f.img;
    if (img.complete && img.naturalWidth) drawBalkone(f);
    showFacadeInfo(f);
  }

  function drawBalkone(f) {
    const img = $('iImg'), s = $('iSvg');
    const W = img.naturalWidth, H = img.naturalHeight;
    s.setAttribute('viewBox', `0 0 ${W} ${H}`);
    s.textContent = '';
    if (f.img_ztop != null && f.img_res) {
      const yg = (f.img_ztop - f.ground) / f.img_res;
      if (yg > 0 && yg < H) el('line', {class: 'ground-line', x1: 0, y1: yg, x2: W, y2: yg}, s);
    }
    if (!f._bk) return;
    f._bk.balkone.forEach((b, i) => {
      const g = el('g', {class: `bk ${b.typ}`, 'data-i': i}, s);
      const [x0, y0, x1, y1] = b.box;
      el('rect', {x: x0, y: y0, width: Math.max(2, x1 - x0), height: Math.max(2, y1 - y0), rx: 3}, g);
      el('title', {}, g).textContent = `${b.typ}, ca. ${fmt(b.breite_m, 1)} m breit`;
      g.addEventListener('click', ev => { ev.stopPropagation(); selectBalkon(f, i); });
    });
  }

  function showFacadeInfo(f) {
    const box = $('iInfo');
    if (!f._bk) {
      box.innerHTML = `<h4>Noch nicht ausgewertet</h4><p class="hint">Diese Fassade wurde noch nicht auf Balkone untersucht. ` +
        `Auswertung mit <code>balkone_claude.py submit --ids ${f.id}</code>.</p>`;
      return;
    }
    const bks = f._bk.balkone, sicher = bks.filter(b => b.typ !== 'unsicher');
    const byFloor = {};
    sicher.forEach(b => { byFloor[b.geschoss] = (byFloor[b.geschoss] || 0) + 1; });
    const kwh = sicher.reduce((s, b) => s + modulVorschlag(b, f.az).kwh, 0);
    box.innerHTML =
      `<h4>Fassade</h4><div class="big">${sicher.length}</div><div class="hint">Balkone/Loggien erkannt` +
      `${bks.length - sicher.length ? `, dazu ${bks.length - sicher.length} unsicher` : ''}</div>` +
      `<dl class="kv"><dt>Geschosse</dt><dd>${f._bk.geschosse ?? '–'}</dd>` +
      `<dt>Bildqualität</dt><dd>${f._bk.bildqualitaet ?? '–'}</dd>` +
      `<dt>Module möglich</dt><dd>${f._nmod}</dd>` +
      `<dt>Ertrag gesamt</dt><dd>≈ ${fmt(kwh)} kWh/Jahr</dd></dl>` +
      (f._bk.anmerkung ? `<p class="note">Modell: ${f._bk.anmerkung}</p>` : '') +
      (sicher.length ? `<p class="hint">Balkon im Bild anklicken für Maße und Modulvorschlag.</p>` :
        `<p class="hint">Auf dieser Fassade wurden keine Balkone gefunden.</p>`) +
      `<p class="note">Ausgewertet mit ${f._bk.model} am ${f._bk.datum}. Graue Flächen im Bild = keine Daten (meist Bäume).</p>`;
  }

  function selectBalkon(f, i) {
    selBk = i;
    document.querySelectorAll('#iSvg .bk').forEach(g => g.classList.toggle('sel', +g.dataset.i === i));
    const b = f._bk.balkone[i];
    const mv = modulVorschlag(b, f.az);
    const sim = window.ERTRAG && ERTRAG.balkone[String(f.id)] && ERTRAG.balkone[String(f.id)][String(i)];
    const simOk = sim && sim.passt ? sim : null;
    const angebot = (window.ANGEBOTE || []).some(a => a.id === `${f.id}_${i}`) ? `${f.id}_${i}` : null;
    const mods = mv.n ? Array.from({length: mv.n}, () =>
      `<div class="mod" style="width:${Math.round((mv.wp / mv.n < 400 ? KLEIN.w : MODUL.w) / Math.max(b.breite_m, MODUL.w) * 100)}%"></div>`).join('') : '';
    $('iInfo').innerHTML =
      `<h4>${b.typ}${b.geschoss != null ? ` · ${b.geschoss === 0 ? 'Erdgeschoss' : b.geschoss + '. OG'}` : ''}</h4>` +
      `<div class="big">≈ ${fmt(b.breite_m, 1)} m</div><div class="hint">Breite der Brüstung bzw. Öffnung</div>` +
      `<dl class="kv">` +
      `<dt>Höhe im Bild</dt><dd>≈ ${fmt(b.hoehe_m, 1)} m</dd>` +
      (b.unterkante_m != null ? `<dt>Unterkante</dt><dd>≈ ${fmt(b.unterkante_m, 1)} m über ${f.kind === 'stufe' ? 'Nachbardach' : 'Gelände'}</dd>` : '') +
      `<dt>Ausrichtung</dt><dd>${NAMES[f.cls]} (${fmt(f.az)}°)</dd>` +
      `<dt>Sicherheit</dt><dd>${fmt(b.sicherheit * 100)} %</dd>` +
      `<dt>Genauigkeit</dt><dd>± 0,3–0,5 m</dd></dl>` +
      `<div class="module-box"><b>Modulvorschlag</b>` +
      (mv.n ? `<div class="mods" style="width:100%">${mods}</div><div>${mv.text}</div>` +
        `<dl class="kv"><dt>Leistung</dt><dd>${fmt(mv.wp)} Wp${mv.fit > MAX_MODULE ? ` (Platz für ${mv.fit})` : ''}</dd>` +
        (simOk ? `<dt>Ertrag</dt><dd>≈ ${fmt(simOk.kwh)} kWh/Jahr</dd>` +
               `<dt>Verschattung</dt><dd>− ${fmt(simOk.verlust * 100)} % (frei: ${fmt(simOk.kwh_frei)} kWh)</dd>` +
               `<dt>Ersparnis</dt><dd>≈ ${fmt(simOk.kwh * EIGENVERBRAUCH * STROMPREIS)} €/Jahr</dd></dl>`
             : `<dt>Ertrag</dt><dd>≈ ${fmt(mv.kwh)} kWh/Jahr</dd>` +
               `<dt>Ersparnis</dt><dd>≈ ${fmt(mv.eur)} €/Jahr</dd></dl>`) +
        (angebot ? `<p><button class="btn-angebot" id="iAngebot">Angebot erstellen</button></p>` : '') :
        `<p class="hint">${mv.text}.</p>`) +
      `</div>` +
      `<p class="note">Annahmen: Module senkrecht am Geländer, ${fmt(EIGENVERBRAUCH * 100)} % Eigenverbrauch, ` +
      `${fmt(STROMPREIS * 100)} ct/kWh, max. ${MAX_MODULE} Module (800-W-Wechselrichter). ` +
      (simOk ? `Ertrag stündlich simuliert mit Verschattung durch Gebäude und Bäume aus dem 3D-Modell${simOk.rand ? ' (Balkon nahe Kachelrand, Horizont unvollständig)' : ''}.` : 'Verschattung noch nicht berücksichtigt (pipeline/angebot.py ausführen).') + `</p>` +
      `<p><button id="iBack">← Fassade</button></p>`;
    if ($('iAngebot')) $('iAngebot').addEventListener('click', () => angebotErstellen(angebot));
    $('iBack').addEventListener('click', () => {
      document.querySelectorAll('#iSvg .bk').forEach(g => g.classList.remove('sel'));
      showFacadeInfo(f);
    });
  }


  // ---------- Angebot erstellen: Ladebildschirm, Daten vorladen, dann zur Angebotsseite ----------
  window.addEventListener('pageshow', () => { $('laden').classList.remove('zeigen', 'sichtbar'); $('ladenBar').style.width = '0'; });
  function angebotErstellen(id) {
    const L = $('laden');
    L.classList.add('zeigen');
    requestAnimationFrame(() => L.classList.add('sichtbar'));
    const schritte = ['Wir vermessen Ihren Balkon …', 'Wir berechnen Sonne und Schatten …', 'Wir wählen passende Solarmodule aus …', 'Ihr Angebot ist fertig.'];
    schritte.forEach((t, i) => setTimeout(() => { $('ladenText').textContent = t; $('ladenBar').style.width = ((i + 1) / schritte.length * 100) + '%'; }, i * 900));
    const daten = Promise.all([`angebot/${id}/daten.json`, `angebot/${id}/modell.json`, 'angebot/lastprofil.json']
      .map(u => fetch(u).then(r => { if (!r.ok) throw new Error(u); return r.arrayBuffer(); })));
    const mindestens = new Promise(r => setTimeout(r, matchMedia('(prefers-reduced-motion: reduce)').matches ? 1800 : 3300));
    Promise.all([daten, mindestens]).then(() => { location.href = `angebot/?id=${id}`; })
      .catch(() => { $('ladenText').textContent = 'Das Angebot konnte nicht geladen werden. Bitte pipeline/angebot.py --alle-angebote ausführen.'; });
  }
  render();
  fit();
})();
</script>
